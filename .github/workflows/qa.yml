name: repository-qa

on:
  push:
  pull_request:

jobs:
  public-release-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public release contents
        run: python scripts/qa/check_public_release.py
      - name: Compile Python sources
        run: python -m compileall -q scripts
